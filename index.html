<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Сүйлөм толуктоо</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,700&display=swap">
<style>
/* Layout: one narrow column for lists and analogy tests. Reading tests widen to two panes on large screens: passage on the left (own scroll), questions on the right. */
:root {
  --bg: #F3F4FB;
  --surface: #FFFFFF;
  --fg: #161A33;
  --muted: #5B6285;
  --line: #DDE0F0;
  --accent: #3F4FC9;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6E9FD;
  --mark: #E0731A;
  --ok: #17703A;
  --ok-bg: #E1F2E7;
  --bad: #B3261E;
  --bad-bg: #FAE6E4;
  --warn-bg: #FFF1CC;
  --warn-fg: #664700;
  --f-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --f-disp: 'Manrope', 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --f-read: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --r: 18px;
  --shadow: 0 1px 2px rgba(30,40,90,.06), 0 8px 24px -12px rgba(30,40,90,.18);
  --head-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1226; --surface: #181C38; --fg: #E8EAFB; --muted: #9AA2CC; --line: #2A3059;
    --accent: #8E9BFF; --accent-ink: #0B1033; --accent-soft: #232A5C; --mark: #FFB066;
    --ok: #6FD18C; --ok-bg: #14301F; --bad: #FF8A80; --bad-bg: #3A1815;
    --warn-bg: #3A2D0B; --warn-fg: #F1CE7A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1226; --surface: #181C38; --fg: #E8EAFB; --muted: #9AA2CC; --line: #2A3059;
  --accent: #8E9BFF; --accent-ink: #0B1033; --accent-soft: #232A5C; --mark: #FFB066;
  --ok: #6FD18C; --ok-bg: #14301F; --bad: #FF8A80; --bad-bg: #3A1815;
  --warn-bg: #3A2D0B; --warn-fg: #F1CE7A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
img, svg, video, canvas { max-width: 100%; height: auto; }
body {
  background: linear-gradient(180deg, var(--accent-soft) 0, var(--bg) 280px) no-repeat, var(--bg); color: var(--fg);
  font: 400 1rem/1.55 var(--f-ui);
  overflow-wrap: break-word;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--accent-soft); }
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Home */
.hero { display: grid; gap: 10px; padding: 12px 0 22px; }
.kicker { font-size: .78rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.hero h1 { font: 700 clamp(1.9rem, 6vw, 2.6rem)/1.1 var(--f-disp); }
.hero p { color: var(--muted); max-width: 52ch; }
.secs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); gap: 14px; }
.sec {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 18px;
  display: grid; gap: 14px; align-content: start; text-align: left; min-width: 0; width: 100%;
}
.sec { box-shadow: var(--shadow); }
.sec:hover { border-color: var(--accent); transform: translateY(-2px); }
.tile, .card, .score, .qcard, .pane-text { box-shadow: var(--shadow); }
.sec h2 { font: 700 1.6rem/1.15 var(--f-disp); }
.sec .desc { color: var(--muted); }
.sec .stats { display: flex; flex-wrap: wrap; gap: 6px 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12.5rem), 1fr)); gap: 12px; }
.tiles.wide { grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
.tile {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; display: grid; gap: 12px; align-content: start; text-align: left; min-width: 0;
}
.tile .num { font: 700 2.1rem/1 var(--f-disp); color: var(--accent); }
.tile h3 { font: 700 1.15rem/1.25 var(--f-disp); }
.tile .meta { color: var(--muted); font-size: .9rem; }
.tile .best { font-weight: 600; font-variant-numeric: tabular-nums; }
.tile:hover { border-color: var(--accent); }
.btn {
  box-shadow: 0 6px 14px -8px var(--accent);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 20px; border-radius: 999px; border: 1.5px solid var(--accent);
  background: var(--accent); color: var(--accent-ink); font-weight: 600; min-height: 44px;
}
.btn.ghost { background: transparent; color: var(--accent); box-shadow: none; }
.btn.sm { min-height: 40px; padding: 8px 14px; }
.btn:disabled { opacity: .45; cursor: default; }
.legend { margin-top: 22px; padding: 14px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: .92rem; }
.legend b { color: var(--fg); }
.list-head { display: grid; gap: 6px; margin-bottom: 18px; }
.list-head h1 { font: 700 clamp(1.7rem, 5vw, 2.2rem)/1.15 var(--f-disp); }
.list-head p { color: var(--muted); }

/* Analogy quiz */
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; margin-bottom: 14px; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 8px 0; min-height: 44px; }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }
.dots { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: 16px; }
.dot {
  min-width: 0; min-height: 2.5rem; border-radius: 8px; border: 1.5px solid var(--line);
  background: var(--surface); font-size: .8rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); padding: 0;
}
.dot.cur { border-color: var(--accent); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.dot.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.dot.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 18px; display: grid; gap: 16px; }
.eyebrow { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.lead { color: var(--muted); font-size: .92rem; }
.stem { padding: 14px 16px; border-radius: 10px; background: var(--accent-soft); }
.pair { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.pc { color: var(--mark); font-weight: 700; }
.stem .pair { font: 700 clamp(1.45rem, 5.2vw, 2rem)/1.25 var(--f-disp); overflow-wrap: anywhere; }
.stem .pc { font-size: 1.15em; }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 10px; align-items: baseline;
  width: 100%; text-align: left; padding: 12px 14px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--surface); min-height: 48px;
}
.opt:hover { border-color: var(--accent); }
.opt .ltr {
  display: inline-grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%;
  border: 1.5px solid var(--line); font-weight: 600; font-size: .9rem; align-self: center;
}
.opt .pair { font: 500 1.08rem/1.35 var(--f-disp); overflow-wrap: anywhere; }
.opt.locked { cursor: default; }
.opt.locked:hover { border-color: var(--line); }
.opt.ok { border-color: var(--ok); background: var(--ok-bg); }
.opt.ok .ltr { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); }
.opt.bad .ltr { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt.dim { opacity: .62; }
.opt .tag { grid-column: 2; font: 600 .8rem var(--f-ui); }
.opt.ok .tag { color: var(--ok); }
.opt.bad .tag { color: var(--bad); }

.fb { border-radius: var(--r); padding: 16px; display: grid; gap: 10px; border: 1.5px solid var(--line); }
.fb.ok { border-color: var(--ok); background: var(--ok-bg); }
.fb.bad { border-color: var(--bad); background: var(--bad-bg); }
.verdict { font-weight: 700; font-size: 1.1rem; }
.fb.ok .verdict { color: var(--ok); }
.fb.bad .verdict { color: var(--bad); }
.why-h { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.rel { font-weight: 600; }
.why { max-width: 66ch; }
.note { padding: 10px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); font-size: .92rem; }
.note.warn { background: var(--warn-bg); color: var(--warn-fg); border-color: transparent; }
.note b { font-weight: 600; }
.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

.score { display: grid; gap: 12px; padding: 20px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 16px; }
.score .big { font: 700 clamp(2.6rem, 11vw, 3.6rem)/1 var(--f-disp); font-variant-numeric: tabular-nums; color: var(--accent); }
.meter { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.tabs { display: flex; gap: 8px; margin: 18px 0 12px; flex-wrap: wrap; }
.tab { padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; min-height: 40px; }
.tab[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.rev { display: grid; gap: 10px; }
details.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
details.item > summary {
  list-style: none; cursor: pointer; padding: 12px 14px; display: grid;
  grid-template-columns: 2.2rem minmax(0, 1fr) auto; gap: 10px; align-items: baseline;
}
details.item > summary::-webkit-details-marker { display: none; }
.qn { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
details.item .pair { font: 700 1.1rem/1.3 var(--f-disp); overflow-wrap: anywhere; }
.chip { font-size: .78rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.skip { background: var(--line); color: var(--muted); }
.item .body { padding: 2px 14px 14px; display: grid; gap: 10px; }
.ans { display: grid; gap: 4px; font-size: .95rem; }
.ans .pair { font: 500 1.02rem/1.35 var(--f-disp); }
.ans b { font-weight: 600; }

.timer.sm { font-size: 1rem; padding: 6px 10px; min-width: 4.4rem; }
.gt { white-space: pre-line; overflow-wrap: anywhere; }
.gt u { text-decoration-thickness: 2px; text-underline-offset: 3px; }
.opt .gt { font: 500 1.05rem/1.4 var(--f-disp); }
.gr .stem .gt { font: 600 1.2rem/1.5 var(--f-disp); }
details.item .gt { font: 600 1rem/1.35 var(--f-disp); }

.gate { max-width: 26rem; margin: 8vh auto 0; }
.gate h1 { font: 700 clamp(1.7rem, 6vw, 2.2rem)/1.15 var(--f-disp); }
.code { width: 100%; font: 700 2rem/1 var(--f-ui); letter-spacing: .5em; text-align: center; padding: 14px 8px 14px calc(8px + .5em); border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); font-variant-numeric: tabular-nums; }
.cerr { color: var(--bad); font-weight: 600; min-height: 1.4em; }

/* Reading comprehension */
.intro-card { display: grid; gap: 14px; }
.intro-card h1 { font: 700 clamp(1.6rem, 5vw, 2.2rem)/1.15 var(--f-disp); }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.fact { padding: 6px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: .9rem; font-variant-numeric: tabular-nums; }
.rules { margin: 0; padding-left: 1.2rem; display: grid; gap: 6px; color: var(--muted); }
.rc-head {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-block: 8px; margin-bottom: 12px; border-bottom: 1px solid var(--line);
  display: grid; gap: 8px;
}
.rc-row { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
.rc-title { font: 700 1.05rem/1.25 var(--f-disp); min-width: 0; flex: 1 1 10rem; }
.timer {
  font: 700 1.35rem/1 var(--f-ui); font-variant-numeric: tabular-nums; padding: 8px 12px; border-radius: 10px;
  background: var(--accent-soft); color: var(--accent); min-width: 5.2rem; text-align: center;
}
.timer.warn { background: var(--warn-bg); color: var(--warn-fg); }
.timer.bad { background: var(--bad-bg); color: var(--bad); }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 8px 14px; font-weight: 600; min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.rc-switch { display: flex; }
.rc-switch .seg { width: 100%; }
.rc-switch .seg button { flex: 1 1 0; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-fg); }
.confirm p { flex: 1 1 14rem; font-weight: 600; }
.rc-body { display: grid; gap: 16px; }
.pane-text, .pane-q { min-width: 0; }
.pane-text { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 14px; display: grid; gap: 14px; align-content: start; }
.pane-q { display: grid; gap: 14px; align-content: start; }
.tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.tools .lbl { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.ptitle { font: 700 1.35rem/1.2 var(--f-disp); }
.psrc { color: var(--muted); font-size: .9rem; }
.pint { font: italic 400 1rem/1.55 var(--f-read); color: var(--muted); }
.plabel { font-weight: 700; color: var(--accent); padding-top: 4px; }
.pnote { font-size: .85rem; color: var(--warn-fg); background: var(--warn-bg); padding: 8px 10px; border-radius: 8px; }
.passage { display: grid; gap: 8px; min-width: 0; }
.lines { overflow-x: auto; font: 400 clamp(.84rem, 1.6vw + .45rem, 1.05rem)/1.75 var(--f-read); padding-bottom: 4px; }
.ln { display: flex; gap: 10px; align-items: baseline; }
.ln .num { flex: none; width: 2.4rem; text-align: right; color: var(--accent); font: 600 .75rem var(--f-ui); font-variant-numeric: tabular-nums; }
.ln .tx { white-space: pre; }
.flow p { margin: 0 0 .8em; font: 400 1.04rem/1.75 var(--f-read); text-wrap: pretty; }
.flow sup.mk { font: 600 .66rem var(--f-ui); color: var(--accent); margin: 0 .25em 0 .35em; vertical-align: super; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 14px; display: grid; gap: 12px; min-width: 0; }
.qcard.done { border-color: var(--accent); }
.qhead { display: flex; align-items: center; gap: 10px; }
.qbadge { display: inline-grid; place-items: center; width: 2rem; height: 2rem; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.qstem { white-space: pre-line; font: 600 1.02rem/1.5 var(--f-disp); }
.ropts { display: grid; gap: 8px; }
.ropt {
  display: grid; grid-template-columns: 1.9rem minmax(0, 1fr); gap: 10px; align-items: baseline; text-align: left; width: 100%;
  padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); min-height: 46px;
}
.ropt .ltr { display: inline-grid; place-items: center; width: 1.9rem; height: 1.9rem; border-radius: 50%; border: 1.5px solid var(--line); font-weight: 600; font-size: .85rem; align-self: start; }
.ropt .ot { overflow-wrap: anywhere; }
button.ropt:hover { border-color: var(--accent); }
.ropt.sel { border-color: var(--accent); background: var(--accent-soft); }
.ropt.sel .ltr { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ropt.ok { border-color: var(--ok); background: var(--ok-bg); }
.ropt.ok .ltr { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.ropt.bad { border-color: var(--bad); background: var(--bad-bg); }
.ropt.bad .ltr { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.ropt .tag { grid-column: 2; font: 600 .8rem var(--f-ui); }
.ropt.ok .tag { color: var(--ok); }
.ropt.bad .tag { color: var(--bad); }
.ropt .rs { grid-column: 2; font-size: .92rem; color: var(--muted); }
.ropt.ok .rs, .ropt.bad .rs { color: var(--fg); }
.exp { padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); display: grid; gap: 6px; }
.exp .why { white-space: pre-line; }
.review-text { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 14px; }
.review-text > summary { cursor: pointer; padding: 12px 14px; font-weight: 600; min-height: 44px; }
.review-text .pane-text { border: 0; border-top: 1px solid var(--line); border-radius: 0 0 12px 12px; }

@media (max-width: 899px) {
  .rc-body[data-pane="text"] .pane-q { display: none; }
  .rc-body[data-pane="q"] .pane-text { display: none; }
}
@media (min-width: 900px) {
  .rc-switch { display: none; }
}
@media (min-width: 1000px) {
  body[data-view="rc"] .wrap { max-width: 82rem; }
  .rc-body { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .rc-body .pane-text {
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--head-h) + 8px);
    max-height: calc(100vh - var(--head-h) - 28px); overflow-y: auto;
  }
}

/* Responsive steps (320px and up) */
@media (max-width: 479px) {
  .card { padding: 16px 14px; }
  .nav .btn { flex: 1 1 100%; }
  .actions .btn { flex: 1 1 100%; }
  details.item > summary { grid-template-columns: 2rem minmax(0, 1fr); }
  details.item > summary .chip { grid-column: 2; justify-self: start; }
  .tab { flex: 1 1 auto; }
  .rc-title { flex-basis: 100%; }
}
@media (min-width: 480px) {
  .dots { grid-template-columns: repeat(10, minmax(0, 1fr)); }
  .nav .btn { flex: 0 1 auto; }
}
@media (min-width: 640px) {
  .secs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (min-width: 600px) {
  .wrap { padding-block: 32px 72px; }
  .hero { padding: 20px 0 28px; }
  .tile { padding: 20px; }
  .sec { padding: 24px 22px; }
  .card { padding: 26px 24px; gap: 18px; }
  .stem { padding: 18px 20px; }
  .score { padding: 26px 24px; }
  details.item > summary { padding: 14px 18px; }
  .item .body { padding: 2px 18px 18px; }
  .qcard { padding: 20px 20px; }
  .pane-text { padding: 20px 20px; }
}
@media (min-width: 900px) {
  .wrap { max-width: 56rem; }
  .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .opt { height: 100%; }
  .dot { min-height: 2.75rem; }
}
@media (min-width: 1200px) {
  .wrap { max-width: 62rem; padding-block: 40px 88px; }
  .tiles { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .tiles.wide { grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); }
}
@media (max-height: 480px) and (orientation: landscape) {
  .wrap { padding-block: 12px 32px; }
  .hero { padding: 4px 0 14px; }
}
@media (prefers-reduced-motion: no-preference) {
  .opt, .ropt, .btn, .tile, .sec, .dot { transition: border-color .15s, background-color .15s; }
}
</style>

<div class="wrap"><div id="app"></div></div>

<script>

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }

    if (k == null || k === false) continue;
    e.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return e;
}

/* passage rendering */
function tokens(s) { return s.toLowerCase().split(/[\s«»"“”(),.;:!?…—–]+/).filter(Boolean); }
function flowParas(p) {
  const L = p.lines;
  const vocab = new Set();
  L.forEach(l => tokens(l[1]).forEach(w => vocab.add(w)));
  const lens = L.map(l => l[1].length).sort((a, b) => a - b);
  const med = lens[Math.floor(lens.length / 2)] || 40;
  const paras = []; let parts = [];
  const flush = () => { if (parts.length) { paras.push(parts); parts = []; } };
  L.forEach((l, idx) => {
    const n = l[0], txt = l[1];
    const prev = idx ? L[idx - 1][1] : '';
    let glue = ' ';
    if (idx && /\S-$/.test(prev)) {
      const A = (prev.match(/([^\s«»"(]+)-$/) || [])[1] || '';
      const B = (txt.match(/^[«"(]*([^\s,.;:!?»")]+)/) || [])[1] || '';
      const al = A.toLowerCase(), bl = B.toLowerCase();
      if (vocab.has(al + '-' + bl)) glue = 'keep';
      else if (vocab.has(al + bl)) glue = 'drop';
      else if (bl.length <= 3 || /^[а-яөүң]/.test(B) && !vocab.has(bl)) glue = 'drop';
      else glue = 'keep';
    }
    if (idx) {
      if (glue === 'drop') { const last = parts[parts.length - 1]; if (typeof last === 'string') parts[parts.length - 1] = last.replace(/-$/, ''); }
      else if (glue === 'keep') { /* join without space */ }
      else { const last = parts[parts.length - 1]; if (typeof last === 'string') parts[parts.length - 1] = last + ' '; else parts.push(' '); }
    }
    if (n) parts.push({ n });
    parts.push(txt);
    if (/[.?!…»)]$/.test(txt.trim()) && txt.length < med * 0.8) flush();
  });
  flush();
  return paras;
}

  const swQ = h('button', { type: 'button', id: 'swq', 'aria-pressed': String(rc.pane === 'q'), onclick: () => setPane('q') }, 'Суроолор');
  function setPane(p) {
    rc.pane = p; body.dataset.pane = p;
    swText.setAttribute('aria-pressed', String(p === 'text')); swQ.setAttribute('aria-pressed', String(p === 'q'));
    toTop();
  }
  const finishBtn = h('button', { class: 'btn sm', type: 'button', id: 'finbtn', onclick: onFinish }, 'Аяктоо');
  const confirmHolder = h('div', { id: 'confirm' });
  const exitBtn = h('button', { class: 'link', type: 'button', onclick: () => {
    if (!rc.exitAsk) { rc.exitAsk = true; exitBtn.textContent = 'Чыгуу? Дагы бир жолу басыңыз'; setTimeout(() => { if (rc) { rc.exitAsk = false; exitBtn.textContent = 'Чыгуу'; } }, 4000); return; }
    stopTimer(); renderRcList();
  } }, 'Чыгуу');
  const left = Math.max(0, rc.deadline - Date.now());
  const head = h('header', { class: 'rc-head', id: 'rchead' },
    h('div', { class: 'rc-row' },
      exitBtn,
      h('p', { class: 'count', id: 'cnt' }),
      h('div', { class: 'timer' + (left < 60000 ? ' bad' : left < 300000 ? ' warn' : ''), id: 'timer', role: 'timer', 'aria-label': 'Калган убакыт' }, fmt(left)),
      finishBtn),
    h('p', { class: 'rc-title' }, 'Текст ' + (rc.t + 1) + '. ' + t.title),
    h('div', { class: 'rc-switch' }, h('div', { class: 'seg', role: 'group', 'aria-label': 'Бөлүк' }, swText, swQ)),
    confirmHolder);
  body.append(textPane(t), qpane);
  mount(head, body);
  rc.ui = { qcards, finishBtn, confirmHolder };
  updateRcCounts();
  qcards.forEach((c, qi) => refreshCard(qi));
  measureHead();
}
function updateRcCounts() {
  const N = RC[rc.t].questions.length, a = rcAnswered();
  const c = document.getElementById('cnt'); if (c) c.textContent = a + ' / ' + N + ' жооп';
  const sq = document.getElementById('swq'); if (sq) sq.textContent = 'Суроолор · ' + a + '/' + N;
}
function refreshCard(qi) {
  const card = rc.ui.qcards[qi], a = rc.ans[qi];
  card.classList.toggle('done', a !== null);
  card._btns.forEach((b, j) => { const on = a === j; b.classList.toggle('sel', on); b.setAttribute('aria-pressed', String(on)); });
}
function rcPick(qi, j) {
  if (rc.finished) return;
  rc.ans[qi] = rc.ans[qi] === j ? null : j;
  refreshCard(qi); updateRcCounts();
  if (rc.confirming) { rc.confirming = false; rc.ui.confirmHolder.replaceChildren(); measureHead(); }
}
function onFinish() {
  const N = RC[rc.t].questions.length, left = N - rcAnswered();
  if (left > 0 && !rc.confirming) {
    rc.confirming = true;
    const idx = rc.ans.map((a, i) => a === null ? i + 1 : null).filter(Boolean).join(', ');
    rc.ui.confirmHolder.replaceChildren(h('div', { class: 'confirm', role: 'alert' },
      h('p', null, 'Жооп берилбеген суроолор: ' + idx + '. Аяктайсызбы?'),
      h('button', { class: 'btn sm ghost', type: 'button', onclick: () => { rc.confirming = false; rc.ui.confirmHolder.replaceChildren(); measureHead(); } }, 'Улантуу'),
      h('button', { class: 'btn sm', type: 'button', onclick: () => finishRc(false) }, 'Аяктоо')));
    measureHead();
    return;
  }
  finishRc(false);
}
function isOk(q, a) { return a !== null && (a === q.k || (q.alt || []).includes(a)); }
function finishRc(timeout) {
  if (!rc || rc.finished) return;
  rc.finished = true; stopTimer();
  rc.used = Math.min(RC_MIN * 60000, Date.now() - rc.start);
  rc.timeout = timeout;
  rc.score = RC[rc.t].questions.reduce((n, q, j) => n + (isOk(q, rc.ans[j]) ? 1 : 0), 0);
  saveBest('rc-best', rc.t, rc.score);
  rcFilter = 'all';
  renderRcResult(); toTop();
}
function optReview(q, j, a) {
  const alt = (q.alt || []).includes(j), key = j === q.k;
  const correct = key || alt;
  let cls = 'ropt', tag = null;
  if (correct) {
    cls += ' ok';
    if ((q.alt || []).length) tag = key ? (a === j ? 'Сиздин жооп. Ачкычтагы жооп' : 'Ачкычтагы жооп') : (a === j ? 'Сиздин жооп. Текст боюнча туура' : 'Текст боюнча туура');
    else tag = a === j ? 'Сиздин жооп, туура' : 'Туура жооп';
  } else if (a === j) { cls += ' bad'; tag = 'Сиздин жооп, ката'; }
  return h('div', { class: cls },
    h('span', { class: 'ltr' }, LET[j]), h('span', { class: 'ot' }, q.o[j]),
    tag ? h('span', { class: 'tag' }, tag) : null,
    q.x[j] ? h('span', { class: 'rs' }, q.x[j]) : null);
}
function renderRcResult() {
  setView('rc-result');
  const t = RC[rc.t], N = t.questions.length, score = rc.score;
  const pct = Math.round(score / N * 100);
  const skipped = rc.ans.filter(x => x === null).length;
  const msg = pct >= 90 ? 'Эң сонун натыйжа.' : pct >= 70 ? 'Жакшы натыйжа. Каталарды талдоодон карап чыгыңыз.' : pct >= 50 ? 'Орточо. Ката кеткен суроолордогу түшүндүрмөнү окуңуз.' : 'Тексттин саптарына кайрылып, талдоону окуңуз.';
  const list = h('div', { class: 'rev' });
  function fill() {
    const items = t.questions.map((q, j) => ({ q, j })).filter(({ q, j }) => rcFilter === 'all' || !isOk(q, rc.ans[j]));
    list.replaceChildren(...items.map(({ q, j }) => {
      const a = rc.ans[j], ok = isOk(q, a);
      const chip = a === null ? h('span', { class: 'chip skip' }, 'Жооп берилген жок') : h('span', { class: 'chip ' + (ok ? 'ok' : 'bad') }, ok ? 'Туура' : 'Ката');
      const short = q.q.split('\n')[0];
      return h('details', { class: 'item', open: !ok },
        h('summary', null, h('span', { class: 'qn' }, String(j + 1)), h('span', { class: 'qstem' }, short.length > 110 ? short.slice(0, 107) + '…' : short), chip),
        h('div', { class: 'body' },
          h('p', { class: 'qstem' }, q.q),
          h('div', { class: 'ropts' }, q.o.map((_, k) => optReview(q, k, a))),
          h('div', { class: 'exp' }, h('p', { class: 'why-h' }, 'Эмне үчүн?'), h('p', { class: 'why' }, q.e)),
          q.w ? h('p', { class: 'note warn' }, h('b', null, 'Көңүл буруңуз. '), q.w) : null,
          q.i ? h('p', { class: 'note' }, h('b', null, 'Эскертүү. '), q.i) : null));
    }));
    if (!list.children.length) list.append(h('p', { class: 'note' }, 'Каталар жок. Бардык суроого туура жооп бердиңиз.'));
  }
  const tabAll = h('button', { class: 'tab', type: 'button', onclick: () => set('all') }, 'Бардык суроолор');
  const tabWrong = h('button', { class: 'tab', type: 'button', onclick: () => set('wrong') }, 'Каталар жана жоопсуздар');
  function set(f) { rcFilter = f; tabAll.setAttribute('aria-pressed', String(f === 'all')); tabWrong.setAttribute('aria-pressed', String(f === 'wrong')); fill(); }
  set(rcFilter);
  const okList = t.questions.map((q, j) => isOk(q, rc.ans[j]) ? j + 1 : null).filter(Boolean);
  const badList = t.questions.map((q, j) => !isOk(q, rc.ans[j]) ? j + 1 : null).filter(Boolean);
  mount(
    h('div', { class: 'bar' }, h('button', { class: 'link', type: 'button', onclick: renderRcList }, 'Тексттер тизмеси'), h('p', { class: 'count' }, 'Текст ' + (rc.t + 1))),
    h('section', { class: 'score' },
      h('p', { class: 'kicker' }, 'Жыйынтык · ' + t.title),
      h('p', { class: 'big' }, score + ' / ' + N),
      h('div', { class: 'meter', role: 'img', 'aria-label': pct + ' пайыз' }, h('i', { style: 'width:' + pct + '%' })),
      h('p', null, pct + '% туура. ' + msg),
      h('div', { class: 'facts' },
        h('span', { class: 'fact' }, 'Убакыт: ' + fmt(rc.used) + ' / ' + RC_MIN + ':00'),
        rc.timeout ? h('span', { class: 'fact' }, 'Убакыт бүттү') : null,
        skipped ? h('span', { class: 'fact' }, 'Жоопсуз: ' + skipped) : null),
      h('p', { class: 'meta' }, 'Туура: ' + (okList.join(', ') || '—') + '. Ката же жоопсуз: ' + (badList.join(', ') || '—') + '.'),
      h('div', { class: 'actions' },
        h('button', { class: 'btn', type: 'button', onclick: () => startRc(rc.t) }, 'Кайра тапшыруу'),
        rc.t < RC.length - 1 ? h('button', { class: 'btn ghost', type: 'button', onclick: () => renderRcIntro(rc.t + 1) }, 'Кийинки текст') : null,
        h('button', { class: 'btn ghost', type: 'button', onclick: renderRcList }, 'Тексттер тизмеси'))),
    h('details', { class: 'review-text' },
      h('summary', null, 'Текстти кайра окуу (сап номерлери менен)'),
      textPane(t)),
    h('h2', { class: 'ptitle' }, 'Талдоо'),
    h('div', { class: 'tabs' }, tabAll, tabWrong),
    list);
}

window.addEventListener('resize', () => { if (view === 'rc-quiz') measureHead(); });
renderGate();
</script>
